services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build:
      context: ./microservices/user
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URL: mongodb://mongodb:27017/uber-users
      JWT_SECRET: replace_me
      RABBIT_URL: amqp://rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq

  captain-service:
    build:
      context: ./microservices/captain
    restart: unless-stopped
    environment:
      PORT: 3002
      MONGO_URL: mongodb://mongodb:27017/uber-captains
      JWT_SECRET: replace_me
      RABBIT_URL: amqp://rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq

  ride-service:
    build:
      context: ./microservices/ride
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_URL: mongodb://mongodb:27017/uber-rides
      JWT_SECRET: replace_me
      RABBIT_URL: amqp://rabbitmq:5672
      BASE_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
    depends_on:
      - mongodb
      - rabbitmq
      - gateway

  gateway:
    build:
      context: ./microservices/gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      RIDE_SERVICE_URL: http://ride-service:3003
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - captain-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: http://localhost:3000
        VITE_GOOGLE_MAPS_API_KEY: replace_me
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  mongo-data:
